findings:
  - >-
    Release transparency is strong and API-change transparency is absent. Every platform
    tag is public and dated, but nothing tells an API consumer whether a given release
    touched /api/public/v1.
  - >-
    A published deprecation policy would be the single cheapest operational improvement
    available to Budibase — the release discipline to support one already exists.
