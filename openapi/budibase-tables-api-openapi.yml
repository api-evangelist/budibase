                    name:
                      type: string
                      description: The name of the column.
                    autocolumn:
                      type: boolean
                      description: Defines whether the column is automatically generated.
                    width:
                      type: number
                      description: Defines the width of the column in the data UI.
            _id:
              description: The ID of the table.
              type: string
      required:
      - data
