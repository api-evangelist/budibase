openapi: 3.2.0
info:
  title: Budibase Tables API
  version: '1.0'
  description: 'Operations tagged Tables across 2 of this provider''s published API definitions: budibase-openapi.yml, budibase-tables-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://budibase.app/api/public/v1
  description: Budibase Cloud Public API
- url: https://{selfhosted}/api/public/v1
  description: Self-hosted Budibase
  variables:
    selfhosted:
      default: budibase.example.com
      description: Hostname of the self-hosted Budibase instance
tags:
- name: Tables
  description: Manage data tables inside an application.
paths:
  /tables:
    get:
      tags:
      - Tables
      summary: Search for tables
      operationId: searchTables
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameSearch'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TableOutput'
      security:
      - apiKeyAuth: []
    post:
      tags:
      - Tables
      summary: Create a table
      operationId: createTable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableInput'
      responses:
        '200':
          description: Created table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableOutput'
      security:
      - apiKeyAuth: []
    servers:
    - url: https://budibase.app/api/public/v1
      description: Budibase Cloud Public API
    - url: https://{selfhosted}/api/public/v1
      description: Self-hosted Budibase
      variables:
        selfhosted:
          default: budibase.example.com
          description: Hostname of the self-hosted Budibase instance
  /tables/{id}:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    get:
      tags:
      - Tables
      summary: Retrieve a table
      operationId: getTable
      responses:
        '200':
          description: Table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableOutput'
      security:
      - apiKeyAuth: []
    put:
      tags:
      - Tables
      summary: Update a table
      operationId: updateTable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableOutput'
      security:
      - apiKeyAuth: []
    delete:
      tags:
      - Tables
      summary: Delete a table
      operationId: deleteTable
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableOutput'
      security:
      - apiKeyAuth: []
    servers:
    - url: https://budibase.app/api/public/v1
      description: Budibase Cloud Public API
    - url: https://{selfhosted}/api/public/v1
      description: Self-hosted Budibase
      variables:
        selfhosted:
          default: budibase.example.com
          description: Hostname of the self-hosted Budibase instance
  /tables/{tableId}:
    servers:
    - url: https://budibase.app/api/public/v1
      description: Budibase Cloud API
      variables:
        apiKey:
          default: <user API key>
          description: The API key of the user to assume for API call.
        appId:
          default: <App ID>
          description: The ID of the app the calls will be executed within the context of, this should start with app_ (production) or app_dev (development).
    put:
      operationId: tableUpdate
      summary: Update a table
      description: Update a table, this could be internal or external.
      tags:
      - Tables
      parameters:
      - $ref: '#/components/parameters/tableId'
      - $ref: '#/components/parameters/appId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/table'
            examples:
              table:
                $ref: '#/components/examples/table'
      responses:
        '200':
          description: Returns the updated table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tableOutput'
              examples:
                table:
                  $ref: '#/components/examples/table'
      security:
      - ApiKeyAuth: []
    delete:
      operationId: tableDestroy
      summary: Delete a table
      description: Delete a table, this could be internal or external.
      tags:
      - Tables
      parameters:
      - $ref: '#/components/parameters/tableId'
      - $ref: '#/components/parameters/appId'
      responses:
        '200':
          description: Returns the deleted table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tableOutput'
              examples:
                table:
                  $ref: '#/components/examples/table'
      security:
      - ApiKeyAuth: []
    get:
      operationId: tableGetById
      summary: Retrieve a table
      description: Lookup a table, this could be internal or external.
      tags:
      - Tables
      parameters:
      - $ref: '#/components/parameters/tableId'
      - $ref: '#/components/parameters/appId'
      responses:
        '200':
          description: Returns the retrieved table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tableOutput'
              examples:
                table:
                  $ref: '#/components/examples/table'
      security:
      - ApiKeyAuth: []
  /tables/search:
    servers:
    - url: https://budibase.app/api/public/v1
      description: Budibase Cloud API
      variables:
        apiKey:
          default: <user API key>
          description: The API key of the user to assume for API call.
        appId:
          default: <App ID>
          description: The ID of the app the calls will be executed within the context of, this should start with app_ (production) or app_dev (development).
    post:
      operationId: tableSearch
      summary: Search for tables
      description: Based on table properties (currently only name) search for tables. This could be an internal or an external table.
      tags:
      - Tables
      parameters:
      - $ref: '#/components/parameters/appId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/nameSearch'
      responses:
        '200':
          description: Returns the found tables, based on the search parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tableSearch'
              examples:
                tables:
                  $ref: '#/components/examples/tables'
      security:
      - ApiKeyAuth: []
components:
  schemas:
    TableInput:
      type: object
      required:
      - name
      - schema
      properties:
        name:
          type: string
        primaryDisplay:
          type: string
        schema:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Column'
    Column:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
          - string
          - longform
          - options
          - number
          - boolean
          - datetime
          - attachment
          - link
          - formula
          - array
        constraints:
          type: object
    TableOutput:
      allOf:
      - type: object
        properties:
          _id:
            type: string
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
      - $ref: '#/components/schemas/TableInput'
    NameSearch:
