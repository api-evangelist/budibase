description: >-
  First-party Budibase SDK, CLI and platform packages published to npm under the
  @budibase scope from the Budibase/budibase monorepo. There is exactly ONE first-party
  HTTP SDK for the Public API — @budibase/sdk, a swagger-codegen build of the same
  packages/server/specs/openapi.yaml this repo harvests — and it is browser-only.
  Budibase publishes no Python, Ruby, Java, Go, .NET, PHP or Rust client; beyond npm the
  only other first-party distribution is Docker images and a Helm chart for self-hosting.
