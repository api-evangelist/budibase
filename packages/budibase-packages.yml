findings:
- >-
  Budibase ships exactly one first-party HTTP SDK — @budibase/sdk (JavaScript,
  browser-only) — generated from its own OpenAPI. Every other @budibase npm package is a
  piece of the platform itself (CLI, client runtime, UI kit, backend services), not an
  API client. sdk_count is 1 language, not 3.
- >-
  Currency is healthy: six of the eight packages were published 2026-08-31, the same day
  as platform release v3.44.0, so the npm surface tracks the product release train.
- >-
  @budibase/client last shipped 2026-05-12 (3.38.1) while the rest of the scope moved to
  3.44.0 — a deliberate divergence for the in-app runtime, not obvious abandonment.
