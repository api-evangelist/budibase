specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Budibase
providerId: budibase
generated: '2026-09-04'
method: probed
source: https://budibase.com/pricing.json
docs: https://budibase.com/pricing
created: '2026-05-04'
modified: '2026-09-04'
provenance_note: >-
  REPLACED 2026-09-04. The previous version of this file was a bulk-sweep scaffold dated
  2026-05-04 carrying invented tiers ("Free / Professional / Enterprise") and invented
  quotas (1,000 and 100,000 requests per month). None of those numbers came from
  Budibase. Every figure below is read from the machine-readable pricing document
  Budibase publishes at https://budibase.com/pricing.json and advertises in its own
  https://budibase.com/llms.txt as "Canonical structured pricing data for agents".
tags:
  - AI Agents
  - Automation
  - Internal Tools
  - Low-Code
  - Open Source
  - Workflow Automation
description: >-
  Budibase plans and pricing, read from the provider's own agent-facing pricing endpoint.
  Budibase prices the PLATFORM (creators, end users, automation actions, AI credits), not
  API calls. Access to the Public API is a plan-gated feature rather than a metered one:
  it is included on every paid Cloud tier, excluded from the self-hosted open-source
  edition, and an "Expanded public API" is Enterprise-only.
plan_count: 5
currency: USD
billing_periods:
  - monthly
  - annual
metered_units:
  - name: automation actions
    note: The primary consumption unit; each tier includes a monthly allowance.
  - name: AI credits
    note: Consumed by Budibase AI agents, models, retrieval and messaging channels.
  - name: creators
    note: Seats that can build. Additional creators are billed per month on Premium and above.
  - name: end users
    note: App consumers. Billed per additional end user per month on every paid tier.
api_access_by_plan:
  public_api:
    open_source: false
    pro: true
    premium: true
    business: true
    enterprise: true
  expanded_public_api:
    open_source: false
    pro: false
    premium: false
    business: false
    enterprise: true
  note: >-
    Read verbatim from the "Public API" and "Expanded public API" rows of pricing.json,
    category Extensibility. The self-hosted open-source edition does NOT include the
    Public API, which is the single most consequential fact for anyone planning to
    integrate with Budibase for free.
plans:
  - id: budibase-open-source
    name: Open Source
    type: free
    hosting: Self-hosted
    price: 0
    currency: USD
    period: month
    entries:
      - label: Base price
        name: base_price
        type: recurring
        price: '0.00'
        timeFrame: month
      - label: Included automation actions
        name: included_actions
        type: quota
        limit: unlimited
        timeFrame: month
      - label: Included AI credits
        name: included_ai_credits
        type: quota
        limit: 0
        timeFrame: month
      - label: Creators
        name: included_creators
        type: seats
        limit: unlimited
      - label: Budibase DB rows
        name: db_rows
        type: quota
        limit: unlimited
      - label: Workspaces
        name: workspaces
        type: quota
        limit: 1
    elements:
      - name: Public API
        included: false
      - name: Budibase AI
        included: false
      - name: Workspace backups
        included: false
      - name: Synchronous webhooks
