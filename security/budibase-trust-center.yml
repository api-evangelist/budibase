    detail: Control the data and resources users can access. Also governs Public API key privileges.
  - name: SSO
    detail: Integrates with auth tools including OpenID Connect. Available on every plan.
  - name: Enforceable SSO
    detail: Business tier and above.
  - name: Audit logs
    detail: Comprehensive audit trails for user actions and system events. Enterprise tier only.
  - name: SCIM / Active Directory sync
    detail: Enterprise tier only.
  - name: Environment variables
    detail: Secure handling of database credentials and API keys across the platform.
  - name: User groups
    detail: Simplifies managing user access to apps.
gaps:
