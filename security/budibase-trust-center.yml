description: >-
  Budibase publishes a security page rather than a dedicated trust center — there is no
  trust.budibase.com (NXDOMAIN, probed 2026-09-04) and no document portal. The page states
  certifications, hosting geography, encryption posture and an audit cadence, but offers no
  downloadable evidence and no subprocessor list.
certifications:
