    claimed: true
    scope: Budibase
    evidence: >-
      "ISO 27001 Certified" in the site footer; "ISO 27001 — Enterprise-grade security
      certifications to meet your compliance requirements" on the security page.
    report_available: false
  - name: GDPR
    claimed: true
    scope: Budibase
    evidence: '"GDPR Compliant" stated in the site footer.'
    report_available: false
  - name: SOC 1 / SOC 2
    claimed: false
    scope: infrastructure provider only
    evidence: >-
      The page says servers are "hosted within the EU (Ireland) in data centers certified
      by SOC 1/2 and ISO 27001". That certifies the DATA CENTRE, not Budibase. Budibase
      makes no SOC 2 claim of its own — recorded here so the inherited wording is not
      misread as a Budibase attestation.
    report_available: false
security_posture:
  hosting_region: EU (Ireland)
  data_in_transit: TLS 1.3, mandatory HTTPS
  data_at_rest: AES-256
  penetration_testing: >-
